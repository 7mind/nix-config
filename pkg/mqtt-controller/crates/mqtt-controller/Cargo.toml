[package]
name = "mqtt-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Unified zigbee2mqtt provisioner and runtime controller"
license = "MIT"

[[bin]]
name = "mqtt-controller"
path = "src/main.rs"

[lib]
name = "mqtt_controller"
path = "src/lib.rs"

[dependencies]
# Async runtime: full feature set so tests can use spawned tasks, channels,
# timers, signal handling, and the multi-threaded scheduler. The binary itself
# only needs a tiny subset but the cost of "full" is negligible at runtime.
tokio = { version = "1", features = ["full"] }

rumqttc = "0.25"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"

sunrise = "3"

clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

thiserror = "2"
anyhow = "1"

uuid = { version = "1", features = ["v4"] }

mqtt-controller-wire = { path = "../mqtt-controller-wire" }

axum = { version = "0.8", features = ["ws"] }

tower-http = { version = "0.6", features = ["fs"] }

futures-util = "0.3"

tokio-tungstenite = { version = "0.26", features = ["connect"] }

# Disable the C mimalloc dependency and unused FTS support.
turso = { version = "0.5", default-features = false }

[dev-dependencies]
rumqttd = "0.19"

tempfile = "3"

rstest = "0.23"

pretty_assertions = "1"

proptest = "1"
